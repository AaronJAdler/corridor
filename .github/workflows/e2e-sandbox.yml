name: Sandbox end to end

# By hand only. This is the one workflow that holds a provider's key: the Increase sandbox
# key, in the `sandbox` environment. It runs the API and the worker against Increase's
# sandbox and moves play money through it (scripts/sandbox_e2e.py). CI never calls it.
on:
  workflow_dispatch:
    inputs:
      webhooks:
        description: "Prove the webhooks (tunnel the API, register an Event Subscription, turn event listing off)"
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time: every run moves money in the same sandbox account.
concurrency:
  group: sandbox-e2e
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.32"
  UV_FROZEN: "1"
  # The quick tunnel for a webhook run, pinned to the checksum Cloudflare publishes with
  # the release.
  CLOUDFLARED_VERSION: "2025.11.1"
  CLOUDFLARED_SHA256: "991dffd8889ee9f0147b6b48933da9e4407e68ea8c6d984f55fa2d3db4bb431d"  # pragma: allowlist secret - a public release checksum

jobs:
  sandbox:
    name: Increase sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: sandbox
    services:
      postgres:
        image: postgres:18
        env:
          # A throwaway server on the runner's own network, holding a scratch database.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - name: Fetch cloudflared for the tunnel
        if: inputs.webhooks
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          echo "${CLOUDFLARED_SHA256}  $RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/cloudflared"
          echo "CORRIDOR_SANDBOX_TUNNEL=$RUNNER_TEMP/cloudflared" >> "$GITHUB_ENV"
      - name: Run the scenario against the Increase sandbox
        # The key reaches this step only, as an environment variable; the script never
        # prints it. The account is optional: without it the adapter uses the one open
        # account the key reaches.
        env:
          CORRIDOR_INCREASE_API_KEY: ${{ secrets.CORRIDOR_INCREASE_API_KEY }}
          CORRIDOR_INCREASE_ACCOUNT_ID: ${{ vars.CORRIDOR_INCREASE_ACCOUNT_ID }}
          CORRIDOR_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
          CORRIDOR_TEST_REDIS_URL: redis://localhost:6379/0
        run: uv run python scripts/sandbox_e2e.py
