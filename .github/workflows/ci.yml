name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job reads the repository and nothing more. No job here holds a secret, so a pull
# request from a fork runs the same checks with the same rights.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.11.32"
  UV_FROZEN: "1"

jobs:
  lint:
    name: Lint, types, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run poe lint
      - run: uv run poe typecheck
      - run: uv run poe contracts

  test:
    name: Tests (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16", "17", "18"]
    # The two images are named by tag, not by digest: they hold only what the tests
    # generate, the job has no secret, and the matrix exists to follow each major line.
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # The server lives for one job on the runner's own network and holds only what
          # the tests generate, so it takes connections without a password. That also keeps
          # a credential, even a throwaway one, out of this file.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CORRIDOR_TEST_POSTGRES_ADMIN_URL: postgresql://postgres@localhost:5432/postgres
      CORRIDOR_TEST_REDIS_URL: redis://localhost:6379/0
      CORRIDOR_TEST_POSTGRES_CLONE_STRATEGY: FILE_COPY
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Configure PostgreSQL as the suite expects
        # The suite is verified against a throwaway server with 400 connections and
        # nothing flushed to disk: the concurrency tests open many connections at once,
        # and a database is cloned for every test. A service container's command line
        # cannot be set, so the settings are written and the server restarted.
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U postgres -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET max_connections = 400" \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off"
          docker restart "$POSTGRES_CONTAINER"
          for _ in $(seq 1 30); do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -U postgres; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: uv sync --frozen
      - run: uv run poe test
      - run: uv run poe smoke

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      # The hook names the file, the line and the kind of finding, and never prints the
      # text it matched. The lockfile is all hashes, which look like secrets and are not.
      - name: Scan every tracked file
        run: git ls-files -z -- ':!uv.lock' | xargs -0 uv run detect-secrets-hook

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      # Audits what the lockfile pins, hashes included, and not whatever a resolver would
      # choose today.
      - name: Export the locked requirements
        run: uv export --frozen --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/requirements.txt"
      - name: Audit them against the advisory database
        run: uv run pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --strict

  workflows:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run poe lint-ci
        env:
          # Lets the security linter look up the actions it audits. Read-only.
          GH_TOKEN: ${{ github.token }}

  infra:
    name: Terraform lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - run: uv sync --frozen
      # Format, validity and the security scan. Nothing here has credentials or a state
      # backend: it reads the files and downloads the provider.
      - run: uv run poe lint-infra
      - name: tflint
        working-directory: infra
        env:
          # Only raises the rate limit for downloading the rule set.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

  image:
    name: Image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Proves the image builds. It is not pushed anywhere and nothing is logged in.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: corridor:ci
