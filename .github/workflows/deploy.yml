name: Deploy

# Started by hand, never by a push. The `production` environment decides who may approve a
# run, and the AWS role can be assumed only by a job that runs in that environment.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, migrate, release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      checks: read # to see that CI passed for the commit being deployed
      id-token: write # exchanged for short-lived AWS credentials; there are no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE }}
      ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE }}
      ECS_MIGRATE_FAMILY: ${{ vars.ECS_MIGRATE_TASK_FAMILY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Refuse to deploy anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploys run from main only."
          exit 1

      # Nothing is built from a commit the CI workflow has not passed. Every job of that
      # workflow, by the name it reports under, must have a check run on this commit that
      # ended in success: one that failed, was skipped, is still running or never ran
      # stops the deploy here, before any credential is asked for. The names are the CI
      # workflow's own; a test keeps this list and that workflow's jobs the same.
      - name: Refuse to deploy a commit that CI has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REQUIRED_CHECKS: |
            Lint, types, contracts
            Tests (PostgreSQL 16)
            Tests (PostgreSQL 17)
            Tests (PostgreSQL 18)
            Secret scan
            Dependency audit
            Workflow lint
            Terraform lint
            Image build
        run: |
          set -euo pipefail
          # The latest run of each check on the commit, which is what the API returns
          # unless asked for all of them: a job that was run again counts as it ended last.
          gh api --paginate "repos/$REPOSITORY/commits/$COMMIT/check-runs?per_page=100" \
            --jq '.check_runs[] | select(.app.slug == "github-actions") | [.name, (.conclusion // "not finished")] | @tsv' \
            > "$RUNNER_TEMP/check-runs.tsv"
          failed=0
          while IFS= read -r name; do
            if [ -z "$name" ]; then continue; fi
            conclusion=$(awk -F '\t' -v name="$name" '$1 == name { print $2 }' "$RUNNER_TEMP/check-runs.tsv" | sort -u | paste -sd ',' -)
            if [ "$conclusion" != "success" ]; then
              echo "::error::CI check \"$name\" has not succeeded for $COMMIT: ${conclusion:-it was not run}."
              failed=1
            fi
          done <<< "$REQUIRED_CHECKS"
          if [ "$failed" -ne 0 ]; then
            echo "::error::Deploys need a commit that the CI workflow has passed."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: corridor-deploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      # Each task definition is copied from its newest revision with only the image
      # changed, so what Terraform set (environment, secrets, roles, sizes) is kept. The
      # image is named by digest: the tasks run exactly what this job built.
      - name: Register task definitions for the new image
        id: taskdefs
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="$REGISTRY/$ECR_REPOSITORY@$DIGEST"
          api_family=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_API_SERVICE" \
            --query 'services[0].taskDefinition' --output text | sed -E 's|.*/([^:]+):[0-9]+$|\1|')
          worker_family=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_WORKER_SERVICE" \
            --query 'services[0].taskDefinition' --output text | sed -E 's|.*/([^:]+):[0-9]+$|\1|')
          register() {
            aws ecs describe-task-definition --task-definition "$1" --query taskDefinition --output json \
              | jq --arg image "$image" '
                  .containerDefinitions |= map(.image = $image)
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                        .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' \
              > "$RUNNER_TEMP/taskdef.json"
            aws ecs register-task-definition --cli-input-json "file://$RUNNER_TEMP/taskdef.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text
          }
          {
            echo "migrate=$(register "$ECS_MIGRATE_FAMILY")"
            echo "api=$(register "$api_family")"
            echo "worker=$(register "$worker_family")"
          } >> "$GITHUB_OUTPUT"

      # Migrations run to completion before any new code serves a request. The task runs
      # where the API runs, with its own security group, which is the only one besides the
      # services' that the database admits.
      - name: Run the migration task and wait for it
        env:
          MIGRATE_TASK_DEFINITION: ${{ steps.taskdefs.outputs.migrate }}
          MIGRATE_SUBNETS: ${{ vars.ECS_PRIVATE_SUBNET_IDS }}
          MIGRATE_SECURITY_GROUP: ${{ vars.ECS_MIGRATE_SECURITY_GROUP_ID }}
        run: |
          set -euo pipefail
          task=$(aws ecs run-task --cluster "$ECS_CLUSTER" --launch-type FARGATE \
            --task-definition "$MIGRATE_TASK_DEFINITION" --count 1 \
            --started-by "deploy-$GITHUB_RUN_ID" \
            --network-configuration "awsvpcConfiguration={subnets=[$MIGRATE_SUBNETS],securityGroups=[$MIGRATE_SECURITY_GROUP],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          if [ -z "$task" ] || [ "$task" = "None" ]; then
            echo "::error::The migration task was not started."
            exit 1
          fi
          echo "Migration task: $task"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          reason=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$task" \
            --query 'tasks[0].stoppedReason' --output text)
          echo "Migration task stopped: exit code $code ($reason)"
          # A task that never started has no exit code; that is a failure too.
          if [ "$code" != "0" ]; then
            echo "::error::The migration did not succeed; the services were not updated."
            exit 1
          fi

      - name: Update the services and wait until they are stable
        env:
          API_TASK_DEFINITION: ${{ steps.taskdefs.outputs.api }}
          WORKER_TASK_DEFINITION: ${{ steps.taskdefs.outputs.worker }}
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_API_SERVICE" \
            --task-definition "$API_TASK_DEFINITION" --query 'service.serviceArn' --output text
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_WORKER_SERVICE" \
            --task-definition "$WORKER_TASK_DEFINITION" --query 'service.serviceArn' --output text
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" "$ECS_WORKER_SERVICE"
          # "Stable" is also what a deployment rolled back by the circuit breaker reaches,
          # so check that each service ended on the definition this run registered.
          for pair in "$ECS_API_SERVICE=$API_TASK_DEFINITION" "$ECS_WORKER_SERVICE=$WORKER_TASK_DEFINITION"; do
            running=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "${pair%%=*}" \
              --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
            if [ "$running" != "${pair#*=}" ]; then
              echo "::error::${pair%%=*} is not running the new task definition; the deployment was rolled back."
              exit 1
            fi
          done
